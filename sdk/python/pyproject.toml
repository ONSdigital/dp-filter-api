[project]
name = "dp-filter-api-sdk-python"
version = "0.1.0"
description = "Python SDK for dp-filter-api"
readme = "README.md"
license = "MIT"
authors = [{ name = "ONSdigital" }]
requires-python = ">=3.14,<3.15"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "pydantic (>=2.13.5,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.8,<0.17.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pip-audit (>=2.10.1,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-xdist (>=3.8.0,<4.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
]
